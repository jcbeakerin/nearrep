[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jcbeakerin-nearrep"
version = "0.1.0"
description = "把候选项映射到类别上，算出训练数据的近重复的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jcbeakerin" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jcbeakerin.github.io"
Repository = "https://github.com/jcbeakerin/nearrep"
Issues = "https://github.com/jcbeakerin/nearrep/issues"

[project.scripts]
nearrep = "nearrep:main"

[tool.setuptools]
py-modules = ["nearrep"]
